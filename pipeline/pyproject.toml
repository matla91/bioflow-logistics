[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "baselhack"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pandas>=2.2,<4", "numpy>=2,<3", "pyyaml>=6,<7", "pydantic>=2,<3", "jsonschema[format]>=4.23,<5", "scikit-learn>=1.6,<2", "typer>=0.15,<1"]
[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
baselhack = "baselhack.cli:app"
[tool.setuptools.packages.find]
where = ["."]
include = ["baselhack*"]

[tool.setuptools.package-data]
"baselhack.data_engine" = ["schema.sql"]

<rect x="554" y="370" width="5" height="28" rx="2.5" fill="#67E8C5"/>
<text x="573" y="393" class="title">Evidence store</text>
<text x="558" y="433" class="body">Public &amp; operational inputs</text>
<text x="558" y="464" class="body">Shipment &amp; batch context</text>
<text x="558" y="495" class="body">Assessment JSON + evidence</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Smartflow: from signals to decisions</title><desc id="desc">External signals and ERP demo records enter the data layer. The ML engine reads inputs and stores assessment JSON. The app reads assessments through an API and records human decisions in the audit store.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091523"/><stop offset="1" stop-color="#102A35"/></linearGradient>
<linearGradient id="teal" x2="1" y2="1"><stop stop-color="#123D45"/><stop offset="1" stop-color="#0C2935"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".18"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#67E8C5" stroke-width="2"/></marker>
<marker id="gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#F7C977" stroke-width="2"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:28px;font-weight:700;fill:#F3FAFF}.body{font-size:22px;fill:#B8CEDA}.label{font-size:20px;font-weight:700;fill:#67E8C5}.small{font-size:18px;fill:#B8CEDA}.tag{font-size:17px;font-weight:700;letter-spacing:2px}</style>
</defs><rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1480" cy="-50" r="380" fill="#34D399" opacity=".035"/>
<text x="70" y="56" class="tag" fill="#67E8C5">SMARTFLOW / DATA FLOW</text>
<text x="70" y="119" font-size="48" font-weight="700" fill="#F3FAFF">From signals to decisions</text>
<text x="70" y="164" class="body">Shared evidence. Explainable recommendations. Human control.</text>

<rect x="70" y="270" width="310" height="160" rx="22" fill="url(#teal)" stroke="#60A5FA" stroke-opacity=".6" filter="url(#shadow)"/>
<rect x="94" y="295" width="5" height="28" rx="2.5" fill="#60A5FA"/>
<text x="113" y="318" class="title">External signals</text>
<text x="98" y="358" class="body">Rhine levels · weather</text>

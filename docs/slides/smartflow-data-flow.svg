<text x="89" y="759" class="small">+ simulated sensor telemetry</text>
<path d="M70 811H1530" stroke="#33525F"/>
<text x="70" y="847" class="body">Rules recommend. ML supplies probabilities. People decide.</text>
<text x="70" y="881" class="small">Conceptual data layer shown together; demo uses separate engine and app databases. Batch-linked latest results are being integrated.</text>

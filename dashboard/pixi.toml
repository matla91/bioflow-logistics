[workspace]
name = "current-affairs-dashboard"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
php = ">=8.5,<8.6"
nodejs = ">=22,<23"

[tasks]
composer = "php .pixi/composer.phar"
serve = "php artisan serve --host=127.0.0.1 --port=8000"
build = "npm run build"
test = "php artisan test"
